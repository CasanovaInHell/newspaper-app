<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Newspaper">
<meta name="theme-color" content="#0d1117">
<title>Newspaper — clean article text</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#0d1117; color:#e6edf3; }
  header { padding:18px 16px 6px; }
  h1 { font-size:26px; margin:0; }
  .sub { color:#9da7b3; font-size:14px; margin-top:4px; }
  .row { display:flex; gap:8px; padding:14px 16px 4px; }
  input[type=url] { flex:1; font-size:16px; padding:13px; border-radius:10px; border:1px solid #3d444d; background:#151a21; color:#e6edf3; }
  button { font-size:16px; border:0; border-radius:10px; padding:13px 18px; cursor:pointer; }
  .go { background:#2ea043; color:#fff; font-weight:700; }
  .go:disabled { background:#444; }
  .ghost { background:#21262d; color:#e6edf3; border:1px solid #3d444d; }
  #status { padding:8px 16px 0; color:#9da7b3; font-size:14px; min-height:20px; }
  #article { padding:10px 16px 8px; }
  #article h2 { font-size:22px; line-height:1.25; }
  #body { white-space:pre-wrap; word-break:break-word; font-size:17px; line-height:1.55; }
  .pastebox { padding:4px 16px; }
  textarea { width:100%; height:110px; font-size:15px; padding:12px; border-radius:10px; border:1px solid #3d444d; background:#151a21; color:#e6edf3; }
  details { padding:6px 16px; color:#9da7b3; font-size:14px; }
  footer { padding:14px 16px 26px; color:#9da7b3; font-size:13px; text-align:center; }
</style>
</head>
<body>
<header>
  <h1>🗞️ Newspaper</h1>
  <div class="sub">Paste an article link. Get the clean text — no ads, no clutter.</div>
</header>

<div class="row">
  <input type="url" id="url" placeholder="Paste article link here" inputmode="url">
  <button class="go" id="fetch">Fetch</button>
</div>
<div id="status"></div>

<div id="article" style="display:none">
  <h2 id="title"></h2>
  <div id="body"></div>
  <div class="row" style="padding-left:0">
    <button class="ghost" id="copy">Copy article</button>
  </div>
</div>

<details>
  <summary>Link won't fetch? Paste the article text instead — she'll clean and hold it for copying.</summary>
  <div class="pastebox">
    <textarea id="paste" placeholder="Paste the article text here"></textarea>
    <div class="row" style="padding-left:0">
      <button class="ghost" id="usepaste">Use this text</button>
    </div>
  </div>
</details>

<footer>Built on the idea of codelucas/newspaper — article extraction, phone-style. Add to Home Screen and it sits like a proper app.</footer>

<script>
const statusEl = document.getElementById('status');
const articleEl = document.getElementById('article');
const titleEl = document.getElementById('title');
const bodyEl = document.getElementById('body');
const fetchBtn = document.getElementById('fetch');
let cleanText = '';

function normalize(u) {
  u = (u || '').trim();
  if (!u) return '';
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  return u;
}
function show(title, text) {
  titleEl.textContent = title || '';
  bodyEl.textContent = text;
  cleanText = (title ? title + '\n\n' : '') + text;
  articleEl.style.display = 'block';
}
function fromJina(raw) {
  let title = '';
  let text = raw;
  const m = raw.match(/^Title:\s*(.+)$/m);
  if (m) title = m[1].trim();
  const mc = raw.match(/Markdown Content:\s*\n([\s\S]*)$/);
  if (mc) text = mc[1];
  text = text.replace(/!\[[^\]]*\]\([^)]*\)/g, '').replace(/\n{3,}/g, '\n\n').trim();
  return { title, text };
}
function fromHTML(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const title = (doc.querySelector('title') || {}).textContent || '';
  doc.querySelectorAll('script,style,nav,header,footer,aside,form').forEach(n => n.remove());
  let text = (doc.body ? doc.body.innerText : '').replace(/\n{3,}/g, '\n\n').trim();
  return { title: title.trim(), text };
}
async function tryFetch(url) {
  const attempts = [
    async () => { const r = await fetch('https://r.jina.ai/' + url); if (!r.ok) throw 0; return fromJina(await r.text()); },
    async () => { const r = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(url)); if (!r.ok) throw 0; return fromHTML(await r.text()); },
    async () => { const r = await fetch('https://corsproxy.io/?url=' + encodeURIComponent(url)); if (!r.ok) throw 0; return fromHTML(await r.text()); }
  ];
  for (const a of attempts) {
    try { const res = await a(); if (res.text && res.text.length > 200) return res; } catch (e) {}
  }
  return null;
}
fetchBtn.onclick = async () => {
  const url = normalize(document.getElementById('url').value);
  if (!url) { statusEl.textContent = 'Paste a link first.'; return; }
  fetchBtn.disabled = true;
  statusEl.textContent = 'Fetching the article… some papers take a while.';
  const res = await tryFetch(url);
  fetchBtn.disabled = false;
  if (res) {
    statusEl.textContent = '';
    show(res.title, res.text);
  } else {
    statusEl.textContent = 'That paper would not hand her the article (paywall or a locked door). Open it in your browser, copy the text, and use the paste box below — she will still clean it and hold it for you.';
    articleEl.style.display = 'none';
  }
};
document.getElementById('usepaste').onclick = () => {
  const t = document.getElementById('paste').value.trim();
  if (!t) { statusEl.textContent = 'The paste box is empty.'; return; }
  statusEl.textContent = '';
  show('', t);
};
document.getElementById('copy').onclick = async () => {
  try { await navigator.clipboard.writeText(cleanText); statusEl.textContent = 'Copied — paste it anywhere.'; }
  catch (e) { statusEl.textContent = 'Copy blocked by the browser — long-press the text instead.'; }
};
</script>
</body>
</html>
